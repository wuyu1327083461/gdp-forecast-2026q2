<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDP 预测模型报告</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #5a5a7a;
    --border: #e8ecf1;
    --accent: #2563eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container { max-width: 640px; width: 100%; text-align: center; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 32px;
  }
  .cards {
    display: grid;
    gap: 14px;
  }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 20px;
    text-decoration: none;
    color: var(--text);
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    border-color: var(--accent);
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .card-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .badge-province { background: #dbeafe; color: #1e40af; }
  .badge-city { background: #ecfdf5; color: #065f46; }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<div class="container">
  <h1>GDP 预测模型报告</h1>
  <p class="subtitle">2026 年二季度 · 江西省及樟树市</p>
  <div class="cards">
    <a class="card" href="GDP预测报告.html">
      <span class="card-badge badge-province">省级</span>
      <div class="card-title">江西省 2026 年 Q2 GDP 预测</div>
      <div class="card-desc">基于官方 Q1 数据 + 1-5 月经济指标，四种方法交叉验证，Q2 中心值 9591 亿元 (+4.1%)</div>
    </a>
    <a class="card" href="樟树市_预测报告.html">
      <span class="card-badge badge-city">县级市</span>
      <div class="card-title">樟树市 2026 年 Q2 GDP 预测</div>
      <div class="card-desc">基于官方数据 + 医药产业特色分析，四种方法交叉验证，Q2 中心值 135.3 亿元 (+6.3%)</div>
    </a>
  </div>
  <div class="footer">数据截至 2026-06-18 · 樟树市 2023-2024 年涉及统计口径调整</div>
</div>
</body>
</html>
